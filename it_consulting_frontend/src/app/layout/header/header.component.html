<header class="site-header" role="banner">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Go to home">
      <span class="brand-logo" aria-hidden="true">
        <img src="/assets/logo.svg" width="28" height="28" alt="IT Consulting logo" decoding="async" />
      </span>
      <span class="brand-text">{{ siteTitle }}</span>
    </a>

    <!-- Mobile menu button -->
    <button
      #menuButton
      class="menu-button"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen ? 'true' : 'false'"
      aria-controls="primary-navigation"
      (click)="toggleMenu()"
    >
      <span class="menu-icon" aria-hidden="true">
        <!-- hamburger / close -->
        <span class="bar" [class.open]="isMenuOpen"></span>
        <span class="bar" [class.open]="isMenuOpen"></span>
        <span class="bar" [class.open]="isMenuOpen"></span>
      </span>
    </button>

    <nav
      #primaryNav
      class="primary-nav"
      [class.open]="isMenuOpen"
      aria-label="Primary"
      [attr.aria-hidden]="isMenuOpen ? null : null"
      id="primary-navigation"
    >
      <ul class="nav-list" role="list">
        <li *ngFor="let link of links">
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [attr.aria-label]="link.ariaLabel || link.label"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="nav-link"
            [class.prominent]="link.prominent"
            (click)="isMenuOpen = false"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
